name: Build BTA Magazine Dev Ready

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build magazine
        run: npm run build

      - name: Assemble dev-ready package
        shell: bash
        run: |
          PACKAGE_DIR="$RUNNER_TEMP/BTA_Magazine_Dev_Ready"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          rsync -a ./ "$PACKAGE_DIR/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/'

          cat > "$PACKAGE_DIR/GITHUB_BUILD_INFO.txt" <<EOF
          Breathtaking Awareness Magazine - Dev Ready Package
          Repository: $GITHUB_REPOSITORY
          Commit: $GITHUB_SHA
          Built by: GitHub Actions

          To run locally:
            npm install
            npm run dev
          EOF

      - name: Upload dev-ready ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTA_Magazine_Dev_Ready
          path: ${{ runner.temp }}/BTA_Magazine_Dev_Ready
          if-no-files-found: error
          retention-days: 30
