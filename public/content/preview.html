<!doctype html><meta charset="utf-8"><title>BTA Magazine Content Preview</title><style>body{font-family:system-ui;margin:2rem;max-width:900px}h1{color:#6d28d9}.card{border:1px solid #ddd;border-radius:12px;padding:1rem;margin:1rem 0}</style><h1>BTA Magazine Content Preview</h1><div id="app"></div><script>fetch('./articles.json').then(r=>r.json()).then(d=>{app.innerHTML=d.chapters.map(ch=>`<h2>${ch.title}</h2>`+d.articles.filter(a=>a.chapter===ch.title).map(a=>`<div class=card><h3>${a.title}</h3><p><em>${a.subtitle||''}</em></p><p>${a.date||''}</p><p><a href='./${a.markdownPath.replace('content/','')}'>Open Markdown</a></p></div>`).join('')).join('')})</script>
